name: Admit dependency lock

on:
  pull_request:

permissions:
  contents: write

jobs:
  admit-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/social-vertical-slice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate exact dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock only when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: admit social-slice dependency lock"
          git push origin HEAD:${{ github.head_ref }}
