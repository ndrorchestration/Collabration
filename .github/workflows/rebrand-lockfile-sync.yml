name: Rebrand lockfile sync

on:
  push:
    branches:
      - chore/collabration-rebrand-2026-09-16

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: chore/collabration-rebrand-2026-09-16
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize Collabration lockfile"
          git push origin HEAD:chore/collabration-rebrand-2026-09-16
