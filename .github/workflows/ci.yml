name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} governance and domain tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run validate:governance
      - run: npm test

  web-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:web

  supply-chain:
    name: Dependency custody checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Record package-manager identity and policy
        run: |
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          test "$(npm config get min-release-age)" = "7"
      - name: Frozen lockfile install with lifecycle scripts disabled
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - name: Verify registry signatures and provenance (advisory)
        continue-on-error: true
        run: npm audit signatures
